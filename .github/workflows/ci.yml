name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: parallel
          POSTGRES_PASSWORD: parallel_ci_password
          POSTGRES_DB: parallel_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U parallel -d parallel_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://parallel:parallel_ci_password@localhost:5432/parallel_ci?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-secret
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm turbo run lint

      - name: Apply database migrations
        run: pnpm --filter api exec prisma migrate deploy

      - name: Build
        run: pnpm turbo run build

      - name: Test
        run: pnpm turbo run test
