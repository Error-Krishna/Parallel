name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: parallel
          POSTGRES_PASSWORD: parallel_ci_password
          POSTGRES_DB: parallel_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U parallel -d parallel_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://parallel:parallel_ci_password@localhost:5432/parallel_ci?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-secret-not-for-real-use-1234567890
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter api exec prisma generate

      - name: Lint
        run: pnpm turbo run lint

      - name: Apply database migrations
        run: pnpm --filter api exec prisma migrate deploy

      - name: Build
        run: pnpm turbo run build

      - name: Test
        run: pnpm turbo run test

      - name: E2E test
        run: pnpm --filter api test:e2e
        env:
          JWT_ISSUER: parallel-api
          JWT_AUDIENCE: parallel-app
          # Low salt rounds here, not in the app's own default — keeps CI fast without
          # touching the real production-appropriate value in configuration.ts.
          BCRYPT_SALT_ROUNDS: "4"
